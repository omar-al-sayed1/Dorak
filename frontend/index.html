<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e6f68">
    <title>Clinic Reminders</title>
    <!-- Before the stylesheet, so a saved theme or a collapsed sidebar never flashes (as on the old pages). -->
    <script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t;
        if (localStorage.getItem("sidebar") === "collapsed") document.documentElement.dataset.sidebar = "collapsed"; } catch (e) {}</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
