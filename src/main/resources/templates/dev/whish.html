<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fake Whish</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center;
               color: #1d2433; background: #fbeee9; }
        main { width: min(22rem, calc(100vw - 2rem)); background: #fff; border-radius: 16px; padding: 1.5rem;
               box-shadow: 0 12px 40px -18px rgba(0, 0, 0, .35); }
        .brand { font-weight: 800; color: #e2231a; letter-spacing: -.02em; font-size: 1.4rem; }
        .dev { display: inline-block; margin-inline-start: .4rem; padding: .1rem .45rem; border-radius: 6px; font-size: .7rem;
               font-weight: 700; color: #7a4b00; background: #ffe6b3; vertical-align: middle; }
        p { margin: .4rem 0; color: #5b6475; }
        .amount { font-size: 2.2rem; font-weight: 800; margin: 1rem 0 .2rem; color: #1d2433; }
        form { margin: 0; }
        .actions { display: grid; gap: .5rem; margin-top: 1.25rem; }
        button { width: 100%; padding: .75rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .pay { border: 0; background: #e2231a; color: #fff; }
        .cancel { border: 1px solid #dde1e8; background: #fff; color: #1d2433; }
    </style>
</head>
<body>
<!--/* The fake Whish's payment page (whish.client=fake): stands in for Whish's own, in development. */-->
<main>
    <div><span class="brand">whish</span><span class="dev">DEV · fake</span></div>
    <p class="amount" th:text="'$' + ${checkout.amountUsd()}">$135.00</p>
    <p th:text="${checkout.description()}">Dorak · Clinique Zahle · 3 months</p>
    <p>Nothing is charged: this page only stands in for Whish while developing.</p>
    <div class="actions">
        <form method="post" th:action="@{/dev/whish/{id}/pay(id=${checkout.paymentId()})}">
            <button type="submit" class="pay">Pay</button>
        </form>
        <form method="post" th:action="@{/dev/whish/{id}/cancel(id=${checkout.paymentId()})}">
            <button type="submit" class="cancel">Cancel</button>
        </form>
    </div>
</main>
</body>
</html>
