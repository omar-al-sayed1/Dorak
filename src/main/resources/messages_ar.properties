terms.foot=لديك سؤال عن هذه الشروط؟ اسأل مشغّل دورك، أي الشخص الذي أعدّ الخدمة لعيادتك.
terms.1.title=الخدمة
terms.1.body=يتيح دورك للمرضى حجز المواعيد وتأكيدها وإلغاءها عبر واتساب، ويرسل لهم التذكيرات، ويقدّم لفريقك لوحة لليوم والأسبوع والمرضى والدفعات وتقريرًا شهريًا. نحن نعدّه لعيادتك ونشغّله عنك.
terms.2.title=حسابك
terms.2.body=يسجّل كل شخص الدخول باسم مستخدم وكلمة مرور خاصين به. حافظ على سرية كلمات المرور ولا تشارك حسابًا مع أحد. أنت مسؤول عمّا يجري بحسابات عيادتك، وأخبر المشغّل فورًا إذا ظننت أن أحدًا آخر استخدم حسابًا. بعد عدة كلمات مرور خاطئة يُقفل الحساب لوقت قصير.
terms.3.title=ما تلتزم به عيادتك
terms.3.body=استخدم دورك فقط لإدارة مواعيد مرضاك. أدخل الأسماء وأرقام الهاتف والأوقات الصحيحة. راسل فقط المرضى الذين أعطوا رقمهم للعيادة للتواصل معهم بشأن مواعيدهم. لا تستخدم دورك للإعلانات، ولا لأي شيء مخالف للقانون، ولا لإرسال ما لا علاقة له بموعد المريض.
terms.4.title=معلومات المرضى
terms.4.body=يحفظ دورك فقط ما يحتاج إليه: اسم المريض، ورقم هاتفه، ومعرّفه على واتساب، ولغته المفضلة، وأوقات مواعيده، وإذا استخدمت الحسابات، الرسوم المطلوبة والدفعات. لا يحفظ ملاحظات طبية ولا تشخيصات ولا أسباب الزيارة، وأنت توافق على ألا تكتبها في أي حقل. هذه المعلومات ملك لعيادتك، ونحن نستخدمها فقط لتقديم الخدمة.
terms.5.title=الحذف وإيقاف الرسائل
terms.5.body=المريض الذي يرد بكلمة «توقف» على واتساب لا تصله رسائل بعد ذلك. وعندما يطلب مريض حذف معلوماته، احذفه من صفحة المرضى: تُحذف معه محادثاته وسجلات دفعاته. الحذف لا يمكن التراجع عنه.
terms.6.title=واتساب وميتا
terms.6.body=تُرسل الرسائل عبر منصة واتساب للأعمال التي تديرها شركة ميتا. رقم واتساب الخاص بعيادتك واستخدامه يخضعان أيضًا لشروط ميتا وسياساتها. قد تفرض ميتا رسومًا على الرسائل، وقد تغيّر أسعارها أو قواعدها، وقد تقيّد رقمًا أو توقفه، وهذا خارج عن سيطرة دورك.
terms.7.title=الرسوم
terms.7.body=تدفع رسم الإعداد والرسم الشهري المتفق عليهما مع المشغّل. تكاليف الرسائل التي تفرضها ميتا تظهر كتقديرات في التقرير الشهري. إذا تأخر الدفع، قد تتوقف الخدمة مؤقتًا بعد إشعارك، إلى أن يُسدَّد المبلغ.
terms.8.title=توفّر الخدمة
terms.8.body=نعمل على أن يبقى دورك شغّالًا دائمًا، لكننا لا نستطيع أن نعد بألا ينقطع أبدًا: فهو يعتمد على واتساب والإنترنت ومزوّدي الاستضافة. قد يصل تذكير متأخرًا أو لا يصل. دورك ليس للحالات الطبية الطارئة، ولا يقدّم نصائح طبية.
terms.9.title=المسؤولية
terms.9.body=تبقى عيادتك مسؤولة عن مرضاها وجدول مواعيدها وحساباتها. دورك أداة تساعد في ذلك، ويُقدَّم كما هو. وبقدر ما يسمح به القانون، لا يتحمل دورك مسؤولية المواعيد الفائتة أو الدخل الضائع أو أي خسائر غير مباشرة، ومجموع مسؤوليته لا يتجاوز ما دفعته عيادتك من رسوم عن آخر ثلاثة أشهر.
terms.10.title=إنهاء الخدمة
terms.10.body=يستطيع أي من الطرفين إنهاء الخدمة بإبلاغ الطرف الآخر. عند انتهائها تُغلق حساباتكم. وعند الطلب نسلّمك مواعيد عيادتك ومرضاها في ملف، ثم نحذف معلومات عيادتك من دورك.
terms.11.title=التعديلات والقانون المعتمد
terms.11.body=قد نحدّث هذه الشروط، والتاريخ في الأعلى يبيّن أحدث نسخة، وسنخبرك بأي تغيير مهم قبل أن يسري. تخضع هذه الشروط لقوانين لبنان.

