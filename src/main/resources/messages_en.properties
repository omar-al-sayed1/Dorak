# Terms of service (/terms). A draft in plain words: have a lawyer read it before selling on it.
terms.title=Terms of service
terms.updated=Last updated: 15 November 2026
terms.contents=Sections
terms.intro=These terms are the agreement between your clinic and Dorak, the service that books appointments and sends reminders to your patients on WhatsApp. By signing in to Dorak, you accept them on behalf of your clinic.
terms.foot=A question about these terms? Ask your Dorak operator, the person who set up your clinic.
terms.1.title=The service
terms.1.body=Dorak lets patients book, confirm and cancel appointments on WhatsApp, sends them reminders, and gives your team a dashboard for the day, the week, patients, payments and a monthly report. We set it up for your clinic and run it for you.
terms.2.title=Your account
terms.2.body=Each person signs in with their own username and password. Keep passwords private and do not share a login. You are responsible for what is done with your clinic's logins; tell your operator at once if you think someone else has used one. After several wrong passwords, a login is locked for a short time.
terms.3.title=What your clinic agrees to
terms.3.body=Use Dorak only to run appointments for your own patients. Enter correct names, phone numbers and times. Message only patients who gave their number to the clinic to be contacted about their appointments. Do not use Dorak for advertising, for anything unlawful, or to send anything unrelated to a patient's appointment.
terms.4.title=Patient information
terms.4.body=Dorak stores only what it needs: a patient's name, phone number, WhatsApp identifier, preferred language, appointment times and, if you use Balance, the fees charged and payments made. It does not store medical notes, diagnoses or reasons for a visit, and you agree not to type them into any field. This information belongs to your clinic; we use it only to provide the service.
terms.5.title=Deleting and opting out
terms.5.body=A patient who replies STOP on WhatsApp is no longer messaged. When a patient asks to be removed, delete them from the Patients page: their conversations and payment records are deleted with them. Deleting cannot be undone.
terms.6.title=WhatsApp and Meta
terms.6.body=Messages are sent through the WhatsApp Business Platform, run by Meta. Your clinic's WhatsApp number and its use are also subject to Meta's own terms and policies. Meta may charge for messages, may change its prices or rules, and may limit or suspend a number; Dorak cannot control that.
terms.7.title=Fees
terms.7.body=You pay the setup fee and the monthly fee agreed with your operator. Message costs charged by Meta are shown as estimates in the monthly report. If a payment is late, the service may be paused after notice, until it is settled.
terms.8.title=Availability
terms.8.body=We work to keep Dorak running at all times, but we cannot promise it will never be interrupted: it depends on WhatsApp, the internet and hosting providers. A reminder may arrive late or not at all. Dorak is not for medical emergencies, and it does not give medical advice.
terms.9.title=Responsibility
terms.9.body=Your clinic remains responsible for its patients, its schedule and its accounts. Dorak is a tool to help with them, provided as it is. To the extent the law allows, Dorak is not liable for missed appointments, lost income or other indirect losses, and its total liability is limited to the fees your clinic paid for the last three months.
terms.10.title=Ending the service
terms.10.body=Either side can end the service by telling the other. When it ends, your logins are closed. On request, we give you your clinic's appointments and patients as a file, then delete your clinic's information from Dorak.
terms.11.title=Changes and governing law
terms.11.body=We may update these terms; the date at the top shows the latest version, and we will tell you about any important change before it applies. These terms are governed by the laws of Lebanon.

