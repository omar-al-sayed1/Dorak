# All configuration comes from environment variables (see .env.example). No defaults for secrets.
spring:
  application:
    name: clinic-reminders
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # No hibernate.jdbc.time_zone: it converted plain times and dates (opening hours, days off) through
    # the JVM's own zone, so 15:30 was stored as 13:30 on a server in Beirut. Instants are stored as
    # UTC by Hibernate anyway (timestamptz); times of day and dates are stored as they are.
  flyway:
    locations: classpath:db/migration
  messages:
    basename: messages
    fallback-to-system-locale: false
  # Render each page fully before sending it. Streamed output commits the response early on big
  # pages, and a login page without a session then can't create one for its CSRF token.
  thymeleaf:
    servlet:
      produce-partial-output-while-processing: false
  # Dates and times in URLs and forms are ISO (2026-10-21, 09:30), never locale-styled.
  mvc:
    format:
      date: iso
      time: iso
  # One thread per scheduled job (reminders, webhook sweep, purge, health watch), so a stuck job
  # cannot also stop the health watch that reports it.
  task:
    scheduling:
      pool:
        size: 4

server:
  # In production Caddy terminates HTTPS in front of the app (deploy/). Tomcat trusts its
  # X-Forwarded-* headers when they come from a private address (the Docker network), so redirects,
  # links and the session cookie are https and Secure.
  forward-headers-strategy: native
  shutdown: graceful

app:
  # Public address of this service, for links sent to patients (SPEC section 7).
  base-url: ${APP_BASE_URL}

billing:
  # How clinics pay the operator, shown on their Billing page and in reminders, e.g. "Whish 70 123 456 (Omar)".
  pay-to: ${BILLING_PAY_TO:}

management:
  endpoints:
    web:
      exposure:
        include: health

# Operator alerts (SPEC section 8): Telegram when both are set, otherwise only logged.
alerts:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  check-interval: PT1M
  # A problem that lasts is alerted again this often.
  repeat-after: PT6H
  reminders-late-after: PT10M
  inbox-late-after: PT10M
  failure-window: PT15M
  failure-threshold: 3
  # The backup container runs nightly; a day and two hours without one is a problem.
  backup-max-age: PT26H
  language: en

whatsapp:
  client: cloud
  app-secret: ${WA_APP_SECRET:}
  verify-token: ${WA_VERIFY_TOKEN:}
  graph-version: ${WA_GRAPH_VERSION:}
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  base-url: https://graph.facebook.com
  # Pricing category of each template as approved by Meta (SPEC section 6). appointment_cancelled_by_clinic
  # is not submitted yet: confirm its category once Meta approves it.
  template-categories:
    appointment_reminder: utility
    appointment_reminder_soon: utility
    appointment_cancelled_by_clinic: utility
  # Meta prices by the recipient's country calling code. Add markets from the rate card as needed.
  markets:
    "961": Rest of Middle East
  inbox:
    async: true
    sweep-interval: PT10S
    max-attempts: 5

reminders:
  scheduler:
    enabled: true
    # SPEC asks for every minute; 30 s keeps "sent within 2 minutes of due" comfortably.
    poll-interval: PT30S
    batch-size: 50
  # Language code each template was approved under in Meta, by patient language. Must match exactly.
  template-language-codes:
    ar: ar
    en: en
  # Quick-reply button labels of the approved reminder templates (SPEC section 6). Must match exactly.
  confirm-labels: [Confirm, تأكيد]
  cancel-labels: [Cancel, إلغاء]
